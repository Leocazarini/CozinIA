# Security response headers, factored into a snippet because nginx DROPS every
# inherited add_header the moment a location declares its own — so this has to
# be re-included in each location that sets Cache-Control, not only at the
# server level. `always` sends them on error responses too.
#
# CSP notes for this app (a Vite/React PWA, verified against the built output):
#   - script-src 'self': the build emits only external, hashed scripts and an
#     external registerSW.js — there is no inline script to allow.
#   - style-src 'unsafe-inline': React applies inline styles; styles cannot
#     execute code, so this is not a script-execution risk.
#   - img-src https: data: blob:: recipe photos come from arbitrary recipe
#     sites; previews are blob:/data:.
#   - connect-src 'self': the app only ever calls its own /api.
#   - frame-ancestors 'none': the app is never framed (anti-clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;

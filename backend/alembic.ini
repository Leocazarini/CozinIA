[alembic]
script_location = alembic
prepend_sys_path = .

# Never actually used — app/alembic/env.py always overrides this at runtime
# with DATABASE_URL from app.core.config.Settings (or the env var directly).
# Deliberately not a working connection string, so this file can't double
# as a hardcoded credential.
sqlalchemy.url = driver://user:pass@host/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

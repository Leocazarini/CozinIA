[project]
name = "cozinia-backend"
version = "0.1.0"
description = "Backend for CozinIA - AI-powered recipe extraction app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "openai>=1.55",
    # FastAPI raises at import time if UploadFile/File is declared without it.
    "python-multipart>=0.0.9",
    # Decodes and downscales uploaded recipe photos before they go to the
    # vision model (see app/services/image_intake.py).
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends()` in argument defaults is the idiomatic pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# E501: the given/when/then test naming convention (see docs/TESTING.md)
# intentionally produces long, descriptive names — that's the point.
"tests/*" = ["E501"]

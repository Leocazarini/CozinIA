[project]
name = "cozinia-backend"
version = "0.1.0"
description = "Backend for CozinIA - AI-powered recipe extraction app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "openai>=1.55",
    # FastAPI raises at import time if UploadFile/File is declared without it.
    # Floor at 0.0.18: earlier versions carry a multipart-parsing DoS
    # (CVE-2024-53981). A clean build must never resolve below this.
    "python-multipart>=0.0.18",
    # Decodes and downscales uploaded recipe photos before they go to the
    # vision model (see app/services/image_intake.py).
    "pillow>=11.0",
    # Reads a video's metadata, subtitle tracks and audio out of a link
    # (YouTube, Instagram, TikTok and friends) — see
    # app/services/video_source.py. Floor with no ceiling on purpose: yt-dlp
    # breaks whenever a platform changes its player, and the fix is always to
    # upgrade, so rebuilding the image is routine maintenance for this feature.
    "yt-dlp>=2026.7",
    # Detects the language a recipe was extracted in, offline and for free —
    # see app/services/recipe_translator.py. Only decides *whether* to
    # translate; the translation itself still goes through the AI.
    "langdetect>=1.0.9",
    # Signs and verifies the login tokens (see app/services/auth_service.py).
    "pyjwt>=2.10",
    # Hashes account passwords with Argon2 — the modern, memory-hard default,
    # so a stolen database of hashes is expensive to crack (see
    # app/services/auth_service.py).
    "pwdlib[argon2]>=0.2.1",
    # Slows down and caps abusive callers so an anonymous loop can't drain the
    # OpenRouter credits or pin every worker (see app/main.py).
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends()` in argument defaults is the idiomatic pattern, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# E501: the given/when/then test naming convention (see docs/TESTING.md)
# intentionally produces long, descriptive names — that's the point.
"tests/*" = ["E501"]
# E402: conftest must set JWT_SECRET in the environment (and disable the rate
# limiter) before importing anything that constructs Settings, so a handful of
# imports deliberately sit below that setup.
"tests/conftest.py" = ["E402"]

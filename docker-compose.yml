services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cozinia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cozinia}
      POSTGRES_DB: ${POSTGRES_DB:-cozinia}
    volumes:
      - cozinia_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cozinia} -d ${POSTGRES_DB:-cozinia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cozinia}:${POSTGRES_PASSWORD:-cozinia}@db:5432/${POSTGRES_DB:-cozinia}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  # Smoke test of the whole system: waits for the backend to be healthy
  # (proving boot + migrations + DB connectivity already work), then runs
  # the full backend suite against the real test database, reports the
  # result, and exits — it never stays up.
  tests:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cozinia}:${POSTGRES_PASSWORD:-cozinia}@db:5432/${POSTGRES_DB:-cozinia}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cozinia}:${POSTGRES_PASSWORD:-cozinia}@db:5432/cozinia_test
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
    depends_on:
      backend:
        condition: service_healthy
    command: ["pytest", "-v"]
    restart: "no"

volumes:
  cozinia_db_data:

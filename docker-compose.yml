services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env — sem valor padrão por segurança}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env — sem valor padrão por segurança}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
    volumes:
      - cozinia_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-anthropic/claude-sonnet-5}
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-anthropic/claude-sonnet-5}
      AI_AUDIO_MODEL: ${AI_AUDIO_MODEL:-openai/whisper-1}
      AI_TRANSLATION_MODEL: ${AI_TRANSLATION_MODEL:-anthropic/claude-sonnet-5}
      VIDEO_COOKIES_FILE: ${VIDEO_COOKIES_FILE:-}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Where the dev server forwards /api and /health, so development talks
      # to one origin exactly like the `web` container does in production.
      VITE_DEV_API_PROXY: http://backend:8000
      # Escape hatch, empty by default: the app calls its own origin and the
      # proxy above (or nginx, in the `web` service) forwards to the backend.
      # Only set this to point the frontend at a backend that is *not* behind
      # the same proxy.
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/tests:/app/tests
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      # The PWA manifest and the offline caching rules live here, and the dev
      # server restarts itself when they change — mounted so editing them is
      # the same loop as editing a component. Vite reads both at startup.
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/pwa.config.ts:/app/pwa.config.ts
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5173:5173"

  # The app as the phone sees it: the production build served over https,
  # with the API proxied onto the same origin. That single origin is what
  # makes it installable — a service worker requires a secure context, and an
  # https page cannot call a plain-http backend on another port.
  #
  # Unlike `frontend`, this has no hot-reload: it serves a build baked into
  # the image, so changing the frontend means `docker compose build web`.
  #
  # Deploying to the VPS reuses this service as-is: swap the certificate for
  # the Let's Encrypt one and set WEB_SERVER_NAME to the real domain.
  web:
    build:
      context: ./frontend
      target: web
    environment:
      WEB_SERVER_NAME: ${WEB_SERVER_NAME:-_}
      TLS_CERT_FILE: /etc/nginx/certs/cozinia.pem
      TLS_KEY_FILE: /etc/nginx/certs/cozinia-key.pem
    volumes:
      # Generated by scripts/generate-dev-certs.sh, never committed.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Goes through nginx *and* through the proxy to the backend, so this
      # service is only healthy when the whole path the phone uses works.
      # -k because the CA is local to this machine, not to the container.
      test: ["CMD", "curl", "-fk", "https://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"

  # Smoke test of the whole system: waits for the backend to be healthy
  # (proving boot + migrations + DB connectivity already work), then runs
  # the full backend suite against the real test database, reports the
  # result, and exits — it never stays up.
  tests-backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/cozinia_test
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-anthropic/claude-sonnet-5}
      # Both model vars the video door needs: without them here the tests that
      # assert which model was called would compare "" to "" and pass vacuously.
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-anthropic/claude-sonnet-5}
      AI_AUDIO_MODEL: ${AI_AUDIO_MODEL:-openai/whisper-1}
      AI_TRANSLATION_MODEL: ${AI_TRANSLATION_MODEL:-anthropic/claude-sonnet-5}
    depends_on:
      backend:
        condition: service_healthy
    command: ["pytest", "-v"]
    restart: "no"

  # Same idea as tests-backend, but for the frontend suite (Vitest) — waits
  # for the frontend dev server to be healthy, runs it once, reports and exits.
  tests-frontend:
    build:
      context: ./frontend
      target: dev
    depends_on:
      frontend:
        condition: service_healthy
    command: ["npm", "run", "test:run"]
    restart: "no"

volumes:
  cozinia_db_data:

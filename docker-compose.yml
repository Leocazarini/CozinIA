services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env — sem valor padrão por segurança}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env — sem valor padrão por segurança}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
    volumes:
      - cozinia_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-anthropic/claude-sonnet-5}
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-anthropic/claude-sonnet-5}
      AI_AUDIO_MODEL: ${AI_AUDIO_MODEL:-openai/whisper-1}
      AI_TRANSLATION_MODEL: ${AI_TRANSLATION_MODEL:-anthropic/claude-sonnet-5}
      VIDEO_COOKIES_FILE: ${VIDEO_COOKIES_FILE:-}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    build:
      context: ./frontend
    environment:
      # Read by the browser (not container-to-container), so it must point at
      # the backend's host-published port, not the "backend" service name.
      # Left empty by default on purpose: the frontend then derives the API
      # address from the host that served the page, which is what makes the
      # app work from a phone on the LAN without pinning an IP here.
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/tests:/app/tests
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5173:5173"

  # Smoke test of the whole system: waits for the backend to be healthy
  # (proving boot + migrations + DB connectivity already work), then runs
  # the full backend suite against the real test database, reports the
  # result, and exits — it never stays up.
  tests-backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/cozinia_test
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-5}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-anthropic/claude-sonnet-5}
      # Both model vars the video door needs: without them here the tests that
      # assert which model was called would compare "" to "" and pass vacuously.
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-anthropic/claude-sonnet-5}
      AI_AUDIO_MODEL: ${AI_AUDIO_MODEL:-openai/whisper-1}
      AI_TRANSLATION_MODEL: ${AI_TRANSLATION_MODEL:-anthropic/claude-sonnet-5}
    depends_on:
      backend:
        condition: service_healthy
    command: ["pytest", "-v"]
    restart: "no"

  # Same idea as tests-backend, but for the frontend suite (Vitest) — waits
  # for the frontend dev server to be healthy, runs it once, reports and exits.
  tests-frontend:
    build:
      context: ./frontend
    depends_on:
      frontend:
        condition: service_healthy
    command: ["npm", "run", "test:run"]
    restart: "no"

volumes:
  cozinia_db_data:
